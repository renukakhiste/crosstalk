<!DOCTYPE html>
<html>
<head><title>P0 Icon Generator</title></head>
<body>
<p>Open this file in a browser, right-click each canvas, and "Save image as" to create your icons.</p>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  // Background
  ctx.fillStyle = '#2563eb';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.2);
  ctx.fill();
  // Text
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${s * 0.55}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('P0', s / 2, s / 2 + s * 0.03);
}
[16, 48, 128].forEach(size => {
  drawIcon(document.getElementById('c' + size));
});
</script>
</body>
</html>
