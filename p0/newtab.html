<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P0</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="container">
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>

    <div id="task-display" class="task-section hidden">
      <p class="label">YOUR P0 TODAY</p>
      <h1 class="task-text" id="task-text"></h1>
      <div class="actions">
        <button id="complete-btn" class="btn btn-complete" title="Mark complete">&#10003; Done</button>
        <button id="clear-btn" class="btn btn-clear" title="Clear task">&times; Clear</button>
      </div>
    </div>

    <div id="completed-display" class="task-section hidden">
      <div class="checkmark-circle">
        <svg viewBox="0 0 52 52" class="checkmark-svg">
          <circle cx="26" cy="26" r="25" fill="none" stroke="#4ade80" stroke-width="2"/>
          <path fill="none" stroke="#4ade80" stroke-width="3" d="M14 27l7 7 16-16"/>
        </svg>
      </div>
      <p class="completed-text">P0 crushed today.</p>
      <p class="completed-task" id="completed-task"></p>
    </div>

    <div id="input-section" class="task-section hidden">
      <p class="label">What's your #1 priority today?</p>
      <form id="task-form">
        <input type="text" id="task-input" placeholder="e.g. Ship the landing page" autofocus maxlength="120">
        <button type="submit" class="btn btn-set">Lock it in</button>
      </form>
    </div>

    <p class="quote" id="quote"></p>
  </div>
  <script src="newtab.js"></script>
</body>
</html>
