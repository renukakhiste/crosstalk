<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,700;1,300&family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,800;1,9..144,400&family=Lora:ital,wght@0,700;1,400&family=Outfit:wght@400;700&family=Playfair+Display:ital,wght@0,900;1,400&family=Plus+Jakarta+Sans:wght@400;500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>

  <!-- Shared background layer -->
  <div id="bg"></div>
  <div id="bg-overlay"></div>

  <!-- State 1: Input -->
  <div id="state-input" class="state">
    <div class="input-wrap">
      <p class="input-prompt">What's your P0 today?</p>
      <form id="task-form" autocomplete="off">
        <input
          type="text"
          id="task-input"
          placeholder="Type the one thing that matters most..."
          autocomplete="off"
          spellcheck="false"
          maxlength="120"
          autofocus
        >
      </form>
    </div>
  </div>

  <!-- State 2: Shuffle -->
  <div id="state-shuffle" class="state hidden">
    <div class="typo-wrap" id="shuffle-typo"></div>
    <div class="shuffle-controls">
      <button id="shuffle-btn" class="btn btn-shuffle" type="button">Shuffle</button>
      <button id="lockin-btn" class="btn btn-lockin" type="button">Lock in</button>
    </div>
  </div>

  <!-- State 3: Locked -->
  <div id="state-locked" class="state hidden">
    <div class="typo-wrap" id="locked-typo"></div>
  </div>

  <!-- Hover shuffle icon (locked state only) -->
  <button id="hover-shuffle-btn" class="hover-shuffle" type="button" title="Shuffle design">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 3 21 3 21 8"></polyline>
      <line x1="4" y1="20" x2="21" y2="3"></line>
      <polyline points="21 16 21 21 16 21"></polyline>
      <line x1="15" y1="15" x2="21" y2="21"></line>
      <line x1="4" y1="4" x2="9" y2="9"></line>
    </svg>
  </button>

  <!-- Unsplash photo credit -->
  <div id="photo-credit" class="photo-credit hidden">
    Photo by <a id="credit-name" href="#" target="_blank" rel="noopener"></a> on
    <a href="https://unsplash.com/?utm_source=p0&utm_medium=referral" target="_blank" rel="noopener">Unsplash</a>
  </div>

  <script src="lib/emphasis.js"></script>
  <script src="data/backgrounds.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
