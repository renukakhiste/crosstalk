<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P0</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <h1 class="popup-title">What's your P0 today?</h1>
    <div class="popup-input-wrapper">
      <input
        type="text"
        id="popup-input"
        class="popup-input"
        placeholder="Type your one thing..."
        autocomplete="off"
        spellcheck="false"
        maxlength="120"
      />
    </div>
    <p class="popup-hint">Press Enter to update</p>
    <p id="popup-current" class="popup-current"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
